<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; font-src 'self' data:; img-src 'self' data:"
    />
    <title>Loop</title>
    <link rel="stylesheet" href="../../node_modules/@xterm/xterm/css/xterm.css" />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <header id="titlebar">
      <div class="brand">
        <img class="brand-logo" src="logo.png" alt="" />
        <span class="brand-name">Loop</span>
      </div>
      <div class="titlebar-tools" id="titlebar-tools"></div>
    </header>

    <div id="body">
      <nav id="rail" aria-label="Workspaces"></nav>
      <aside id="sidebar">
        <div id="sidebar-head"></div>
        <div id="sidebar-list"></div>
        <div id="sidebar-foot"></div>
      </aside>
      <main id="main">
        <div id="stage">
          <div id="panes"></div>
          <div id="empty"></div>
        </div>
        <section id="composer" hidden></section>
      </main>
      <aside id="drawer" hidden></aside>
    </div>

    <footer id="statusbar"></footer>
    <div id="overlay"></div>

    <script src="../../node_modules/@xterm/xterm/lib/xterm.js"></script>
    <script src="../../node_modules/@xterm/addon-fit/lib/addon-fit.js"></script>
    <script src="../../node_modules/@xterm/addon-web-links/lib/addon-web-links.js"></script>
    <script src="../../node_modules/@xterm/addon-unicode11/lib/addon-unicode11.js"></script>
    <script src="../../node_modules/@xterm/addon-webgl/lib/addon-webgl.js"></script>
    <script src="../../node_modules/@xterm/addon-serialize/lib/addon-serialize.js"></script>
    <script src="app.js"></script>
    <script src="layout.js"></script>
    <script src="features.js"></script>
    <script src="servers.js"></script>
    <script src="board.js"></script>
    <script src="phone.js"></script>
    <script src="subs.js"></script>
    <script src="voice.js"></script>
    <script src="chat.js"></script>
    <script src="tools.js"></script>
    <script src="statusbar.js"></script>
  </body>
</html>
