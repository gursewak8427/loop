# Builds the phone app. Android anywhere; iPhone only on a Mac, which is why
# that half runs on GitHub's macOS machines rather than your PC.
#
# Run it from the Actions tab (Run workflow), then download the files it leaves
# under Artifacts. The iPhone one is unsigned: sign it with your own Apple ID
# when you install it, as the README explains.
name: Phone app

on:
  workflow_dispatch:
  push:
    tags: ['app-v*']

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          # The version the phone app is built with here. A newer one deprecates
          # package:flutter/material.dart, which fails analyze on every file.
          flutter-version: 3.35.3
          cache: true
      - run: flutter pub get
        working-directory: app
      - run: flutter analyze
        working-directory: app
      - run: flutter build apk --release
        working-directory: app
      - uses: actions/upload-artifact@v4
        with:
          name: loop-android
          path: app/build/app/outputs/flutter-apk/app-release.apk

  iphone:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          # The version the phone app is built with here. A newer one deprecates
          # package:flutter/material.dart, which fails analyze on every file.
          flutter-version: 3.35.3
          cache: true
      - run: flutter pub get
        working-directory: app
      # No Apple account is needed to compile; it is needed to sign, and that
      # happens on your own PC with Sideloadly, using your free Apple ID.
      - run: flutter build ios --release --no-codesign
        working-directory: app
      - name: Wrap it as an ipa
        working-directory: app
        run: |
          mkdir -p Payload
          cp -R build/ios/iphoneos/Runner.app Payload/
          zip -qry Loop.ipa Payload
      - uses: actions/upload-artifact@v4
        with:
          name: loop-iphone
          path: app/Loop.ipa
