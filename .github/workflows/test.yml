name: test
on:
  push:
    branches: [main]
  pull_request:
jobs:
  desktop:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      # The relay tests need ws. Scripts are skipped: Electron's download is not needed to test.
      - run: npm ci --ignore-scripts
      - run: npm test

  # The phone app is half of Loop, so a change to it is checked as well.
  phone:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          # The version the phone app is built with here. A newer one deprecates
          # package:flutter/material.dart, which fails analyze on every file.
          flutter-version: 3.35.3
          cache: true
      - run: flutter pub get
        working-directory: app
      - run: flutter analyze
        working-directory: app
      - run: flutter test
        working-directory: app
